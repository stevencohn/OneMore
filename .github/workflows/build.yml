name: Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - beta
          - release
        default: beta
      beta:
        description: 'Beta number (e.g. 1 for 7.1.0-beta.1) — required when build type is beta'
        required: false
        type: number
      output_build_log:
        description: 'Output build log to console'
        required: false
        type: boolean
        default: false
      run_tests:
        description: 'Run automation tests after building'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-2025-vs2026
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup devenv
        uses: seanmiddleditch/gha-setup-vsdevenv@cf96bf5b227cac6af28c04c4a4e69286ea444163 # master

      - name: Setup NuGet
        uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2

      - name: Validate inputs
        shell: pwsh
        run: |
          if ('${{ inputs.build_type }}' -eq 'beta' -and [string]::IsNullOrWhiteSpace('${{ inputs.beta }}')) {
            throw "Beta number is required when build_type is 'beta'"
          }

      - name: Build solution
        shell: pwsh
        run: |
          $isBeta = '${{ inputs.build_type }}' -eq 'beta'
          $arch = $isBeta ? 'x64' : 'All'
          $beta = $isBeta ? "-Beta -BetaNumber ${{ inputs.beta }}" : ''
          $echoLog = '${{ inputs.output_build_log }}' -eq 'true' ? '-EchoLog' : ''
          Invoke-Expression ".\build.ps1 -Architecture $arch $beta $echoLog"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OneMoreBuild-log
          path: ${{ runner.temp }}\OneMoreBuild.log
          if-no-files-found: warn

      - name: Run tests
        if: inputs.run_tests
        shell: pwsh
        run: .\build.ps1 -Test

      - name: Upload test results
        if: always() && inputs.run_tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OneMoreTests-results
          path: ${{ runner.temp }}\OneMoreTests.trx
          if-no-files-found: warn

      - name: Stage installer
        id: stage
        shell: pwsh
        run: |
          $msis = Get-ChildItem "$env:USERPROFILE\Downloads\OneMore_*_Setup*.msi"
          if (-not $msis) { throw "No MSI found in $env:USERPROFILE\Downloads" }
          foreach ($msi in $msis) { Move-Item $msi.FullName $msi.Name -Force }
          $exes = Get-ChildItem "$env:USERPROFILE\Downloads\OneMore_*_Setup*.exe" -ErrorAction SilentlyContinue
          foreach ($exe in $exes) { Move-Item $exe.FullName $exe.Name -Force }
          $version = $msis[0].BaseName -replace '^OneMore_(.+)_Setup\w+$', '$1'
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OneMore-${{ steps.stage.outputs.version }}${{ inputs.build_type == 'beta' && '-x64' || '' }}
          path: OneMore_*_Setup*.*

      - name: Create release
        shell: pwsh
        run: |
          $isBeta = '${{ inputs.build_type }}' -eq 'beta'
          $version = "${{ steps.stage.outputs.version }}"
          $assets = Get-ChildItem "OneMore_*_Setup*.msi","OneMore_*_Setup*.exe" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          if (-not $assets) { throw "No installer assets found in working directory" }

          if ($isBeta) {
            $tag = "$version-beta.${{ inputs.beta }}"
            $notes = "_This is a preview of what's to come. These changes have not yet been fully tested and no guarantee is provided. Be cautious using this build against your production notebooks. But if you're curious and willing to give it a try, please send feedback by opening a ticket. Thanks!_`n`n"
            $ghArgs = @('release', 'create', $tag) + $assets +
              @('--title', "OneMore $tag", '--notes', $notes, '--generate-notes', '--prerelease')
          } else {
            $tag = $version
            $ghArgs = @('release', 'create', $tag) + $assets +
              @('--title', "OneMore $tag", '--generate-notes', '--draft')
          }
          & gh @ghArgs
        env:
          GH_TOKEN: ${{ github.token }}
