name: Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - beta
          - release
        default: beta
      beta:
        description: 'Beta number (e.g. 1 for 7.1.0-beta.1) — required when build type is beta'
        required: false
        type: number
      output_build_log:
        description: 'Output build log to console'
        required: false
        type: boolean
        default: false
      run_tests:
        description: 'Run automation tests after building'
        required: false
        type: boolean
        default: false
      skip_signing:
        description: 'Skip code signing'
        required: false
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Validate inputs
        shell: pwsh
        run: |
          if ('${{ inputs.build_type }}' -eq 'beta' -and [string]::IsNullOrWhiteSpace('${{ inputs.beta }}')) {
            throw "Beta number is required when build_type is 'beta'"
          }

      - name: Compute architecture matrix
        id: matrix
        shell: pwsh
        run: |
          $arches = '${{ inputs.build_type }}' -eq 'beta' ? @('x64') : @('x86', 'x64', 'ARM64')
          $json = ($arches | ConvertTo-Json -Compress)
          # ConvertTo-Json emits a bare string (not an array) for single-element input
          if ($arches.Count -eq 1) { $json = "[$json]" }
          echo "matrix=$json" >> $env:GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup devenv
        uses: seanmiddleditch/gha-setup-vsdevenv@cf96bf5b227cac6af28c04c4a4e69286ea444163 # master

      - name: Setup NuGet
        uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2

      - name: Compile
        shell: pwsh
        run: |
          $isBeta = '${{ inputs.build_type }}' -eq 'beta'
          $beta = $isBeta ? "-Beta -BetaNumber ${{ inputs.beta }}" : ''
          $echoLog = '${{ inputs.output_build_log }}' -eq 'true' ? '-EchoLog' : ''
          Invoke-Expression ".\build.ps1 -Architecture ${{ matrix.arch }} -CompileOnly $beta $echoLog"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OneMoreBuild-log-${{ matrix.arch }}
          path: ${{ runner.temp }}\OneMoreBuild.log
          if-no-files-found: warn

      # --- sign assemblies before WiX packages them into the MSI ---
      # NOTE: upload-artifact already zips whatever it's given for transit/storage, so we
      # upload the raw files directly here rather than pre-zipping them ourselves — doing
      # both would hand SignPath a zip-inside-a-zip, which its "assemblies" (zip-file root)
      # configuration won't match against.

      - name: Upload unsigned assemblies
        if: ${{ !inputs.skip_signing }}
        id: upload-unsigned-assemblies
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-assemblies-${{ matrix.arch }}
          path: |
            OneMore\bin\Debug\River.OneMoreAddIn.dll
            OneMore\bin\Debug\OneMoreCalendar.exe
            OneMore\bin\Debug\OneMoreCli.exe
            OneMore\bin\Debug\OneMoreProtocolHandler.exe
            OneMore\bin\Debug\OneMoreTray.exe
            OneMore\bin\Debug\OneMoreSetupActions.exe

      - name: Sign assemblies
        if: ${{ !inputs.skip_signing }}
        uses: SignPath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '61b65606-056b-43c6-b72d-789abcb45ecf'
          project-slug: 'OneMore'
          signing-policy-slug: 'test-signing'
          artifact-configuration-slug: 'assemblies'
          github-artifact-id: '${{ steps.upload-unsigned-assemblies.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed-assemblies'

      - name: Replace assemblies with signed copies
        if: ${{ !inputs.skip_signing }}
        shell: pwsh
        run: |
          $files = Get-ChildItem signed-assemblies -Recurse -File
          if (-not $files) { throw "No signed assemblies found in signed-assemblies\" }
          foreach ($f in $files) { Copy-Item $f.FullName ".\OneMore\bin\Debug\$($f.Name)" -Force }

      # --- build MSI from now-signed assemblies, sign it before it's embedded in a bundle ---

      - name: Build MSI
        shell: pwsh
        run: |
          $isBeta = '${{ inputs.build_type }}' -eq 'beta'
          $beta = $isBeta ? "-Beta -BetaNumber ${{ inputs.beta }}" : ''
          Invoke-Expression ".\build.ps1 -Architecture ${{ matrix.arch }} -BuildMsi $beta"

      - name: Stage MSI for signing
        if: ${{ !inputs.skip_signing }}
        id: stage-msi
        shell: pwsh
        run: |
          $msiArch = switch ('${{ matrix.arch }}') { 'ARM64' { 'x64' } 'ArmNative' { 'ARM64' } default { '${{ matrix.arch }}' } }
          $msi = Get-ChildItem "OneMoreSetup\bin\$msiArch\Debug\OneMore_*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No MSI found to sign" }
          New-Item -ItemType Directory -Force -Path unsigned-msi | Out-Null
          Copy-Item $msi.FullName unsigned-msi\
          echo "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($msi.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned MSI
        if: ${{ !inputs.skip_signing }}
        id: upload-unsigned-msi
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-msi-${{ matrix.arch }}
          path: unsigned-msi\*.msi

      - name: Sign MSI
        if: ${{ !inputs.skip_signing }}
        uses: SignPath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '61b65606-056b-43c6-b72d-789abcb45ecf'
          project-slug: 'OneMore'
          signing-policy-slug: 'test-signing'
          artifact-configuration-slug: 'installer-msi'
          github-artifact-id: '${{ steps.upload-unsigned-msi.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed-msi'

      - name: Replace MSI with signed copy
        if: ${{ !inputs.skip_signing }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed-msi -Recurse -Filter '${{ steps.stage-msi.outputs.name }}' | Select-Object -First 1
          if (-not $signed) { throw "Signed MSI not found in signed-msi\" }
          Copy-Item $signed.FullName '${{ steps.stage-msi.outputs.path }}' -Force

      # --- build the burn bundle (ARM64 only) from the now-signed MSI, then move final artifact(s) to Downloads ---

      - name: Finish kit
        shell: pwsh
        run: |
          $isBeta = '${{ inputs.build_type }}' -eq 'beta'
          $beta = $isBeta ? "-Beta -BetaNumber ${{ inputs.beta }}" : ''
          Invoke-Expression ".\build.ps1 -Architecture ${{ matrix.arch }} -FinishKit $beta"

      - name: Stage bundle EXE for signing
        if: matrix.arch == 'ARM64' && !inputs.skip_signing
        id: stage-bundle
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:USERPROFILE\Downloads\OneMore_*_SetupARM64.exe" | Select-Object -First 1
          if (-not $exe) { throw "No bundle EXE found to sign" }
          New-Item -ItemType Directory -Force -Path unsigned-bundle | Out-Null
          Copy-Item $exe.FullName unsigned-bundle\
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned bundle EXE
        if: matrix.arch == 'ARM64' && !inputs.skip_signing
        id: upload-unsigned-bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-bundle-${{ matrix.arch }}
          path: unsigned-bundle\*.exe

      - name: Sign bundle EXE
        if: matrix.arch == 'ARM64' && !inputs.skip_signing
        uses: SignPath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '61b65606-056b-43c6-b72d-789abcb45ecf'
          project-slug: 'OneMore'
          signing-policy-slug: 'test-signing'
          artifact-configuration-slug: 'bundle-exe'
          github-artifact-id: '${{ steps.upload-unsigned-bundle.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed-bundle'

      - name: Replace bundle EXE with signed copy
        if: matrix.arch == 'ARM64' && !inputs.skip_signing
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed-bundle -Recurse -Filter '${{ steps.stage-bundle.outputs.name }}' | Select-Object -First 1
          if (-not $signed) { throw "Signed bundle EXE not found in signed-bundle\" }
          Copy-Item $signed.FullName '${{ steps.stage-bundle.outputs.path }}' -Force

      - name: Run tests
        if: matrix.arch == 'x64' && inputs.run_tests
        shell: pwsh
        run: .\build.ps1 -Test

      - name: Upload test results
        if: always() && matrix.arch == 'x64' && inputs.run_tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OneMoreTests-results
          path: ${{ runner.temp }}\OneMoreTests.trx
          if-no-files-found: warn

      - name: Stage installer
        shell: pwsh
        run: |
          $msis = Get-ChildItem "$env:USERPROFILE\Downloads\OneMore_*_Setup*.msi" -ErrorAction SilentlyContinue
          foreach ($msi in $msis) { Move-Item $msi.FullName $msi.Name -Force }
          $exes = Get-ChildItem "$env:USERPROFILE\Downloads\OneMore_*_Setup*.exe" -ErrorAction SilentlyContinue
          foreach ($exe in $exes) { Move-Item $exe.FullName $exe.Name -Force }
          if (-not (Get-ChildItem OneMore_*_Setup*.* -ErrorAction SilentlyContinue)) {
            throw "No installer found in $env:USERPROFILE\Downloads"
          }

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OneMore-installer-${{ matrix.arch }}
          path: OneMore_*_Setup*.*
          if-no-files-found: error

  release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: OneMore-installer-*
          path: installers
          merge-multiple: true

      - name: Create release
        shell: pwsh
        run: |
          $isBeta = '${{ inputs.build_type }}' -eq 'beta'
          # @(...) forces an array even when only one file matches (e.g. beta builds, which
          # produce a single MSI) — without it, Select-Object -ExpandProperty returns a bare
          # string, and $assets[0] would index its first *character* instead of the element
          $assets = @(Get-ChildItem "installers/OneMore_*_Setup*.msi", "installers/OneMore_*_Setup*.exe" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName)
          if (-not $assets) { throw "No installer assets found in installers/" }

          $version = (Get-Item $assets[0]).BaseName -replace '^OneMore_(.+)_Setup\w+$', '$1'

          if ($isBeta) {
            $tag = "$version-beta.${{ inputs.beta }}"
          } else {
            $tag = $version
          }
          Write-Host "... tag: [$tag]"

          # fetch generated notes ourselves rather than passing --notes and --generate-notes
          # together to `gh release create` (that combination was intermittently rejected
          # with a spurious "tag_name is not a valid tag" 422 from a shallow/detached checkout)
          # gh's stdout is captured line-by-line as a string array by PowerShell; re-join with
          # real newlines so later string interpolation doesn't collapse them into single spaces
          $generated = (gh api "repos/${{ github.repository }}/releases/generate-notes" -f "tag_name=$tag" -q '.body') -join "`n"

          if ($isBeta) {
            $preview = "_This is a preview of what's to come. These changes have not yet been fully tested and no guarantee is provided. Be cautious using this build against your production notebooks. But if you're curious and willing to give it a try, please send feedback by opening a ticket. Thanks!_`n`n"
            $notes = "$preview$generated"
            $ghArgs = @('release', 'create', $tag) + $assets +
              @('--title', "OneMore $tag", '--notes', $notes, '--target', '${{ github.sha }}', '--prerelease')
          } else {
            $ghArgs = @('release', 'create', $tag) + $assets +
              @('--title', "OneMore $tag", '--notes', $generated, '--target', '${{ github.sha }}', '--draft')
          }
          & gh @ghArgs
        env:
          GH_TOKEN: ${{ github.token }}
